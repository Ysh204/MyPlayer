name: my_player
description: Cross-platform desktop and Android video player powered by media_kit.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_riverpod: ^2.6.1
  window_manager: ^0.4.3
  desktop_drop: ^0.5.0
  file_picker: ^8.1.4
  shared_preferences: ^2.3.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/presets/eq_presets.json
